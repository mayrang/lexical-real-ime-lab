name: real-ime-harness
on:
  workflow_dispatch:
    inputs:
      lexical_ref:
        description: 'Lexical commit SHA, branch, or PR ref (refs/pull/<N>/head)'
        required: false
        default: main
      platforms:
        description: 'Comma list of linux,macos,windows,android'
        required: false
        default: linux,macos,windows,android
      groups:
        description: 'Comma list of scenario groups (matrix, android, replay)'
        required: false
        default: matrix,audit,android
      reps:
        description: 'Runs per cell'
        required: false
        default: '3'
      scen:
        description: 'Optional: one scenario id (debugging)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # docker/build-push-action would upload a .dockerbuild artifact that `gh run download` cannot unzip.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'
  LEXICAL_URL: 'http://127.0.0.1:3013/?isRichText=true&emptyEditor=true&showTreeView=false&selectBlock=false&tableHorizontalScroll=true'

jobs:
  build-lexical:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.co.outputs.sha }}
    env:
      HUSKY: '0'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GH_TOKEN: ${{ github.token }}
      REF: ${{ inputs.lexical_ref }}
    steps:
      - name: Check out Lexical
        id: co
        run: |
          case "$REF" in
            refs/*) FETCH="$REF";;
            *) FETCH=$(gh api "repos/facebook/lexical/commits/$REF" --jq .sha);;
          esac
          git init -q lex
          git -C lex fetch -q --depth 1 https://github.com/facebook/lexical.git "$FETCH"
          git -C lex checkout -q FETCH_HEAD
          git -C lex log -1 --format='%H %ci %s'
          echo "sha=$(git -C lex rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [ -f lex/.nvmrc ] && echo "node=$(cat lex/.nvmrc)" >> "$GITHUB_OUTPUT" || echo "node=24" >> "$GITHUB_OUTPUT"
          PM=$(node -p 'require("./lex/package.json").packageManager || "npm"')
          echo "pm=$PM" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.co.outputs.node }}
      - name: Install Lexical dependencies
        working-directory: lex
        env:
          PM: ${{ steps.co.outputs.pm }}
        run: |
          node -v
          case "$PM" in
            pnpm@*) npm i -g --no-audit --no-fund "$PM"; pnpm -v; pnpm install --frozen-lockfile;;
            *) npm ci --legacy-peer-deps --no-audit --no-fund;;
          esac
      - name: Build playground (development mode, as Lexical's own e2e CI)
        working-directory: lex
        env:
          PM: ${{ steps.co.outputs.pm }}
        run: |
          case "$PM" in pnpm@*) pnpm run build-playground-dev;; *) npm run build-playground-dev;; esac
          ls packages/lexical-playground/build | head
      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: lex/packages/lexical-playground/build/
          retention-days: 7

  # Replay group: every scenario runs on its parent and fix commit. Plan the builds, then build each one.
  replay-plan:
    if: contains(inputs.groups, 'replay')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          PLATFORMS: ${{ inputs.platforms }}
          SCEN: ${{ inputs.scen }}
        run: |
          M=$(node harness/scenarios/replay.mjs "$PLATFORMS" "$SCEN")
          echo "$M"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build-replay:
    needs: replay-plan
    if: needs.replay-plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.replay-plan.outputs.matrix) }}
    name: build-${{ matrix.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HUSKY: '0'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      SHA: ${{ matrix.sha }}
      PM: ${{ matrix.pm }}
    steps:
      - name: Check out Lexical ${{ matrix.sha }}
        run: |
          git init -q lex
          git -C lex fetch -q --depth 1 https://github.com/facebook/lexical.git "$SHA"
          git -C lex checkout -q FETCH_HEAD
          git -C lex log -1 --format='%H %ci %s'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # pm and node come from the scenario's commits: 2026 commits before packageManager have pnpm-lock.yaml only.
      - name: Install Lexical dependencies
        working-directory: lex
        run: |
          node -v
          case "$PM" in
            pnpm@*) npm i -g --no-audit --no-fund "$PM"; pnpm -v; pnpm install --frozen-lockfile --config.verifyDepsBeforeRun=false;;
            *) npm -v; npm ci --legacy-peer-deps --no-audit --no-fund;;
          esac
      # Commits before build-playground-dev (2023-24): the playground's own vite build. Its config resolves the
      # lexical packages to their sources (the spikes ran these commits on the Vite dev server the same way).
      - name: Build playground (development mode)
        working-directory: lex
        run: |
          case "$PM" in pnpm@*) R="pnpm run"; P="pnpm -C packages/lexical-playground run";; *) R="npm run"; P="npm run --prefix packages/lexical-playground";; esac
          if node -e 'process.exit(require("./package.json").scripts["build-playground-dev"] ? 0 : 1)'; then
            $R build-playground-dev || { echo "::warning::build-playground-dev failed, playground build only"; $P build-dev; }
          else
            $P build-dev
          fi
          test -f packages/lexical-playground/build/index.html
          ls packages/lexical-playground/build | head
      - uses: actions/upload-artifact@v4
        with:
          name: playground-${{ matrix.sha }}
          path: lex/packages/lexical-playground/build/
          retention-days: 7

  linux-image:
    if: contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (warms the layer cache)
        uses: docker/build-push-action@v6
        with:
          context: harness/native/linux
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=realime-linux
          cache-to: type=gha,scope=realime-linux,mode=max

  linux:
    needs: [build-lexical, linux-image, build-replay]
    # build-replay is skipped without the replay group, and a failed build only loses its own scenario (H: inconclusive).
    if: ${{ !cancelled() && needs.build-lexical.result == 'success' && needs.linux-image.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [ibus, fcitx5]
        browser: [chromium, firefox, webkit]
    name: linux-${{ matrix.engine }}-${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: playground
          path: playground
      - uses: actions/download-artifact@v4
        if: contains(inputs.groups, 'replay')
        with:
          pattern: playground-*
          path: playgrounds
      - name: Install harness dependencies
        run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@v3
      - name: Load image from the layer cache
        uses: docker/build-push-action@v6
        with:
          context: harness/native/linux
          platforms: linux/amd64
          load: true
          tags: realime-linux:ci
          cache-from: type=gha,scope=realime-linux
      - name: Run scenarios
        env:
          ENGINE: ${{ matrix.engine }}
          BROWSER: ${{ matrix.browser }}
          HGROUPS: ${{ inputs.groups }}
          REPS: ${{ inputs.reps }}
          SCEN: ${{ inputs.scen }}
          LEXICAL_COMMIT: ${{ needs.build-lexical.outputs.sha }}
          HARNESS_IMAGE: playwright:v1.63.0-noble+${{ hashFiles('harness/native/linux/Dockerfile') }}
        run: |
          mkdir -p records logs && chmod 777 records logs
          docker run --rm --user pwuser -e HOME=/home/pwuser --ipc=host --network host \
            -e ENGINE -e BROWSER -e HGROUPS -e REPS -e SCEN -e LEXICAL_COMMIT -e LEXICAL_URL -e HARNESS_IMAGE -e GITHUB_SHA -e ImageOS -e ImageVersion \
            -v "$GITHUB_WORKSPACE:/work" -w /work realime-linux:ci bash -c '
              source harness/native/linux/env.sh "$ENGINE" > logs/env.log 2>&1
              node harness/serve.mjs playground 3013 > logs/serve.log 2>&1 &
              for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3013/ && break; sleep 1; done
              for g in ${HGROUPS//,/ }; do
                node harness/run.mjs --os linux --browser "$BROWSER" --group "$g" --reps "$REPS" \
                  --lexical-url "$LEXICAL_URL" --lexical-commit "$LEXICAL_COMMIT" --out records ${SCEN:+--scen "$SCEN"}
              done
              cp /tmp/*.log logs/ 2>/dev/null || true
            '
          ls records | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records-linux-${{ matrix.engine }}-${{ matrix.browser }}
          path: |
            records/
            logs/
          retention-days: 30

  macos:
    needs: [build-lexical, build-replay]
    if: ${{ !cancelled() && needs.build-lexical.result == 'success' && contains(inputs.platforms, 'macos') }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: macos-${{ matrix.browser }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: playground
          path: playground
      - uses: actions/download-artifact@v4
        if: contains(inputs.groups, 'replay')
        with:
          pattern: playground-*
          path: playgrounds
      - name: Install harness dependencies and the browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install ${{ matrix.browser }}
      - name: Build key tool and enable input sources
        run: |
          swiftc -O harness/native/oskeys.swift -o harness/native/oskeys
          O=harness/native/oskeys
          # Japanese: no live conversion, so Space picks the first candidate (run 44678896671: "日本語版").
          defaults write com.apple.inputmethod.Kotoeri JIMPrefLiveConversionKey -bool false
          killall JapaneseIM JapaneseIM-RomajiTyping 2>/dev/null || true
          LC=$(defaults read com.apple.inputmethod.Kotoeri JIMPrefLiveConversionKey)
          echo "JIMPrefLiveConversionKey=$LC"
          [ "$LC" = 0 ] || { echo "::error::Kotoeri live conversion is still on ($LC)"; exit 1; }
          $O --enable com.apple.inputmethod.Korean --enable com.apple.inputmethod.Korean.2SetKorean \
            --enable com.apple.inputmethod.Kotoeri.RomajiTyping --enable com.apple.inputmethod.Kotoeri.RomajiTyping.Japanese \
            --enable com.apple.inputmethod.SCIM --enable com.apple.inputmethod.SCIM.ITABC 2>&1
          for s in com.apple.inputmethod.Korean.2SetKorean com.apple.inputmethod.Kotoeri.RomajiTyping.Japanese com.apple.inputmethod.SCIM.ITABC com.apple.keylayout.US; do
            $O --source $s 2>&1 | grep -E "select|AXIs"
          done
          sw_vers
      - name: Run scenarios
        env:
          BROWSER: ${{ matrix.browser }}
          HGROUPS: ${{ inputs.groups }}
          REPS: ${{ inputs.reps }}
          SCEN: ${{ inputs.scen }}
          LEXICAL_COMMIT: ${{ needs.build-lexical.outputs.sha }}
          OSKEYS_LOG: ${{ github.workspace }}/logs/oskeys.log
        run: |
          mkdir -p records logs
          node harness/serve.mjs playground 3013 > logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3013/ && break; sleep 1; done
          for g in ${HGROUPS//,/ }; do
            node harness/run.mjs --os macos --browser "$BROWSER" --group "$g" --reps "$REPS" \
              --lexical-url "$LEXICAL_URL" --lexical-commit "$LEXICAL_COMMIT" --out records ${SCEN:+--scen "$SCEN"}
          done
          ls records | wc -l
      - name: Screenshot on failure
        if: failure()
        run: screencapture -x logs/screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records-macos-${{ matrix.browser }}
          path: |
            records/
            logs/
          retention-days: 30

  windows:
    needs: [build-lexical]
    if: contains(inputs.platforms, 'windows')
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: windows-${{ matrix.browser }}
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: playground
          path: playground
      - name: Install harness dependencies and the browser
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install ${{ matrix.browser }}
      - name: Build key tool and add Korean and Japanese input methods
        shell: powershell
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:harness\native\winkeys.exe harness\native\winkeys.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $l = Get-WinUserLanguageList
          $l.Add('ko-KR')
          $l.Add('ja-JP')
          Set-WinUserLanguageList $l -Force
          Get-WinUserLanguageList | Format-List LanguageTag,InputMethodTips
          if (-not (Get-Process ctfmon -ErrorAction SilentlyContinue)) { Start-Process "$env:WINDIR\System32\ctfmon.exe"; Start-Sleep 2; "started ctfmon" }
          [System.Environment]::OSVersion.VersionString
          .\harness\native\winkeys.exe --info
          exit 0
      - name: Run scenarios
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          HGROUPS: ${{ inputs.groups }}
          REPS: ${{ inputs.reps }}
          SCEN: ${{ inputs.scen }}
          LEXICAL_COMMIT: ${{ needs.build-lexical.outputs.sha }}
          WINKEYS_LOG: ${{ github.workspace }}/logs/winkeys.log
        run: |
          mkdir -p records logs
          node harness/serve.mjs playground 3013 > logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3013/ && break; sleep 1; done
          # Chinese is out of scope on Windows.
          for g in ${HGROUPS//,/ }; do
            node harness/run.mjs --os windows --browser "$BROWSER" --group "$g" --reps "$REPS" --langs ko,ja \
              --lexical-url "$LEXICAL_URL" --lexical-commit "$LEXICAL_COMMIT" --out records ${SCEN:+--scen "$SCEN"}
          done
          ls records | wc -l
      - name: Screenshot on failure
        if: failure()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("logs\screen.png")
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records-windows-${{ matrix.browser }}
          path: |
            records/
            logs/
          retention-days: 30

  android:
    needs: [build-lexical, build-replay]
    if: ${{ !cancelled() && needs.build-lexical.result == 'success' && contains(inputs.platforms, 'android') && (contains(inputs.groups, 'android') || contains(inputs.groups, 'replay')) }}
    name: android-chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ANDROID_SYSTEM_IMAGE: 'system-images;android-34;google_apis_playstore;x86_64'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: playground
          path: playground
      - uses: actions/download-artifact@v4
        if: contains(inputs.groups, 'replay')
        with:
          pattern: playground-*
          path: playgrounds
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test IME
        run: harness/native/android/ime/build.sh
      - name: Install harness dependencies (no browsers; Chrome is on the emulator)
        run: npm ci --no-audit --no-fund
      - name: Serve playground and control page
        run: |
          mkdir -p records logs
          nohup node harness/serve.mjs playground 3013 > logs/serve.log 2>&1 &
          nohup node harness/serve.mjs harness/native/android 3014 > logs/serve-control.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3013/ && break; sleep 1; done
          curl -sf -o /dev/null -w "playground %{http_code}\n" http://127.0.0.1:3013/
          curl -sf -o /dev/null -w "control %{http_code}\n" http://127.0.0.1:3014/control.html
      - name: Emulator + run scenarios
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HGROUPS: ${{ inputs.groups }}
          REPS: ${{ inputs.reps }}
          SCEN: ${{ inputs.scen }}
          LEXICAL_COMMIT: ${{ needs.build-lexical.outputs.sha }}
          ANDROID_LOG_DIR: ${{ github.workspace }}/logs
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash harness/native/android/ci.sh "$HGROUPS" "$REPS" "$SCEN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records-android-chrome
          path: |
            records/
            logs/
          retention-days: 30

  report:
    needs: [build-lexical, linux, macos, windows, android]
    if: always() && needs.build-lexical.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: records-*
          path: dl
      - name: Build report
        env:
          REPS: ${{ inputs.reps }}
        run: |
          mkdir -p all
          for d in dl/*/; do
            n=$(basename "$d")
            for f in "$d"records/*.json; do [ -e "$f" ] && cp "$f" "all/${n#records-}-$(basename "$f")"; done
          done
          ls all | wc -l
          node harness/core/report.mjs all report --reps "$REPS"
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report/
          retention-days: 30
