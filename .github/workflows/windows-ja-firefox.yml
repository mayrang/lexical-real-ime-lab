name: real-ime-windows-ja-firefox
on:
  workflow_dispatch:
  push:
    branches: [windows]
    paths: [spike-win.mjs, .github/workflows/windows-ja-firefox.yml]

permissions:
  contents: read

jobs:
  ja-firefox:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build key tool and add input methods
        shell: powershell
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:winkeys.exe winkeys.cs
          $l = Get-WinUserLanguageList
          $l.Add('ko-KR')
          $l.Add('ja-JP')
          Set-WinUserLanguageList $l -Force
          Get-WinUserLanguageList | Format-List LanguageTag,InputMethodTips
          Get-ItemProperty "$env:WINDIR\System32\IME\IMEJP\*.dll" -ErrorAction SilentlyContinue | Select-Object -First 3 Name,@{n='ver';e={$_.VersionInfo.FileVersion}}
          exit 0
      - name: Install Playwright
        shell: bash
        run: |
          npm i playwright@1.63.0
          npx playwright install chromium firefox
      - name: Firefox Japanese, consecutive launches with layout bounce
        continue-on-error: true
        shell: bash
        run: |
          for i in 1 2 3 4; do node spike-win.mjs firefox plain ja-firefox-bounce-$i ja || true; done
          for i in 1 2; do node spike-win.mjs firefox plain ko-firefox-bounce-$i ko || true; done
          for i in 1 2; do node spike-win.mjs firefox plain ja-firefox-bounce-after-ko-$i ja || true; done
          for i in 1 2; do node spike-win.mjs chromium plain ja-chromium-bounce-$i ja || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-ja-firefox
          path: out/
