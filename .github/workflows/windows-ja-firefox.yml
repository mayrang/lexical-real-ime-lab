name: real-ime-windows-ja-firefox
on:
  workflow_dispatch:
  push:
    branches: [windows]
    paths: [spike-win.mjs, .github/workflows/windows-ja-firefox.yml]

permissions:
  contents: read

jobs:
  ja-firefox:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build key tool and add input methods
        shell: powershell
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:winkeys.exe winkeys.cs
          $l = Get-WinUserLanguageList
          $l.Add('ko-KR')
          $l.Add('ja-JP')
          Set-WinUserLanguageList $l -Force
          Get-WinUserLanguageList | Format-List LanguageTag,InputMethodTips
          Get-ItemProperty "$env:WINDIR\System32\IME\IMEJP\*.dll" -ErrorAction SilentlyContinue | Select-Object -First 3 Name,@{n='ver';e={$_.VersionInfo.FileVersion}}
          exit 0
      - name: Install Playwright
        shell: bash
        run: |
          npm i playwright@1.63.0
          npx playwright install chromium firefox
      - name: Firefox Japanese, later launches with leftovers killed or ctfmon restarted
        continue-on-error: true
        shell: bash
        run: |
          node spike-win.mjs firefox plain ja-firefox-first ja || true
          tasklist //FI "IMAGENAME eq firefox.exe" || true
          node spike-win.mjs firefox plain ja-firefox-second ja || true
          tasklist //FI "IMAGENAME eq firefox.exe" || true
          taskkill //F //IM firefox.exe || true
          node spike-win.mjs firefox plain ja-firefox-killed ja || true
          for i in 1 2; do
            powershell -NoProfile -Command 'Stop-Process -Name ctfmon -Force -ErrorAction SilentlyContinue; Start-Process "$env:WINDIR\System32\ctfmon.exe"; Start-Sleep 3; Get-Process ctfmon | Select-Object Id,StartTime'
            node spike-win.mjs firefox plain ja-firefox-ctfmon-$i ja || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-ja-firefox
          path: out/
