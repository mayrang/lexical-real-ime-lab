name: ime-switch-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [probe.mjs, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and enable
        run: |
          swiftc -O oskeys.swift -o oskeys
          ./oskeys --enable com.apple.inputmethod.Korean --enable com.apple.inputmethod.Korean.2SetKorean \
            --enable com.apple.inputmethod.Kotoeri.RomajiTyping --enable com.apple.inputmethod.Kotoeri.RomajiTyping.Japanese \
            --enable com.apple.inputmethod.SCIM --enable com.apple.inputmethod.SCIM.ITABC 2>&1
          defaults read com.apple.HIToolbox 2>&1 | grep -iE "PerContext|Global" || true
          npm i --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install chromium webkit
      - name: Probe
        run: |
          for b in chromium webkit; do for ime in ko zh ja; do for s in pre mid back; do node probe.mjs $b $ime $s || true; done; done; done
      - name: Probe with per-context input off
        run: |
          defaults write com.apple.HIToolbox AppleGlobalTextInputProperties -dict TextInputGlobalPropertyPerContextInput 0
          for b in chromium webkit; do for ime in ko zh; do node probe.mjs $b $ime mid || true; done; done
